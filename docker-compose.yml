# ContextIQ: API + Streamlit UI from one image. See docs/DEPLOYMENT.md.
#
#   docker compose up -d --build      # build the image and start both services
#   docker compose logs -f api        # follow the API logs
#   docker compose down               # stop; add -v to also delete the indexed data
#
# Settings come from ./.env when present (copy .env.example). Without CONTEXTIQ_API_KEYS
# every authenticated request is rejected with 401. Host ports can be moved with
# CONTEXTIQ_API_PORT / CONTEXTIQ_UI_PORT (shell or .env), e.g. when 8000 is already taken.

name: contextiq

x-app-image: &app-image contextiq:local

x-env-file: &env-file
  - path: .env
    required: false

services:
  api:
    image: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CONTEXTIQ_API_PORT:-8000}:8000"
    env_file: *env-file
    environment:
      CONTEXTIQ_DATA_DIR: /app/data
    volumes:
      - contextiq-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    image: *app-image
    pull_policy: never
    command:
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
    ports:
      - "${CONTEXTIQ_UI_PORT:-8501}:8501"
    env_file: *env-file
    environment:
      # Inside the compose network the API is reachable by service name, not localhost.
      CONTEXTIQ_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  contextiq-data:
