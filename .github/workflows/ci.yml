name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
  # Tests must never touch the network; make an accidental model download fail loudly.
  HF_HUB_OFFLINE: "1"

jobs:
  lint-and-test:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check app tests scripts

      - name: Ruff format check
        run: uv run ruff format --check app tests scripts

      - name: Fast tests with coverage
        run: >
          uv run pytest -m "not slow"
          --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  slow-tests:
    name: Slow tests (real embedding model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # The default model name lives in app/core/config.py; a change there refreshes the cache.
          key: hf-${{ runner.os }}-${{ hashFiles('app/core/config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Download the embedding model
        env:
          HF_HUB_OFFLINE: "0"
        run: uv run python scripts/download_models.py

      - name: Slow tests
        run: uv run pytest -m slow -v

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: contextiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the API container
        run: |
          docker run -d --name contextiq-smoke -p 8000:8000 \
            -e CONTEXTIQ_API_KEYS=ci-smoke-key-00001:alpha contextiq:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API healthy"; curl -sS http://localhost:8000/health; echo; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; docker logs contextiq-smoke; exit 1

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f contextiq-smoke >/dev/null 2>&1 || true
