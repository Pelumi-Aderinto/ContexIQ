[project]
name = "contextiq"
version = "0.1.0"
description = "ContextIQ: document-grounded question answering with verifiable citations (RAG over PDFs)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pelumi Aderinto" }]
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
    # LangChain (modular 1.x packages)
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-groq>=1.0",
    # Embeddings + vector search
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    # PDF parsing
    "pymupdf>=1.24",
    # UI
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
contextiq-api = "app.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# CPU-only PyTorch wheels (avoids multi-GB CUDA downloads).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that load the real embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The Streamlit entrypoint must put the repo root on sys.path before importing ``app``.
"app/ui/streamlit_app.py" = ["E402"]
